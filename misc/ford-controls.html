<div class="ford-controls">
  <label for="ford-slider">
    <span>q</span>
    <output id="ford-value">10</output>
  </label>
  <input
    type="range"
    id="ford-slider"
    aria-label="Maximum denominator q"
    min="0"
    max="24"
    value="10"
    step="1"
  >
  <label for="ford-lines-slider">
    <span>Number of lines</span>
    <output id="ford-lines-value">2</output>
  </label>
  <input
    type="range"
    id="ford-lines-slider"
    min="1"
    max="12"
    value="2"
    step="1"
  >
</div>
<script src="../misc/ford-background.js" defer></script>
